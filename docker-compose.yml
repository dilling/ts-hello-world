name: ts-hello-world

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ wants a SINGLE mount at /var/lib/postgresql, not .../data.
      # The image puts its data in a version-specific subdirectory so that
      # `pg_upgrade --link` works without crossing a mount boundary. Mounting
      # /var/lib/postgresql/data instead makes PG18 refuse to start, reporting the
      # directory as an "unused mount/volume".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 20

  # The app itself: HTTP server + pg-boss worker in one container, serving the built SPA.
  #
  # Behind a profile on purpose. The day-to-day loop is `npm run db:up` (Postgres only)
  # plus `npm run dev` on the host, which gives you HMR and fast restarts — you do not
  # want to rebuild an image on every change. Use this service to check the production
  # path works, or to hand someone a one-command demo:
  #
  #   npm run app:up      # build + run everything
  #   npm run app:logs
  #   npm run app:down
  app:
    build: .
    profiles: ['app']
    restart: unless-stopped
    environment:
      # `postgres` is the service name on the compose network, not localhost.
      DATABASE_URL: postgres://app:app@postgres:5432/app
      PORT: '3000'
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations run here rather than in the image build: the build has no database,
    # and this guarantees the schema is current before the server accepts traffic.
    command: sh -c "npm run db:migrate && npm start"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
